# Railway's edge proxy connects from 100.64.0.0/10 and sets X-Real-IP to the
# visitor's address (it overwrites any value the client sends). Use it as the
# client IP, so PHP's REMOTE_ADDR is stable per visitor. Easy!Appointments ties
# sessions to REMOTE_ADDR (sess_match_ip), and without this every request would
# arrive from a different proxy address and log the user out.
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy 100.64.0.0/10
